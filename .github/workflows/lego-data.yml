# Hält die Rebrickable-Daten für den LEGO-Teilefinder (lego/data/) aktuell.
# Manuell starten: GitHub → Actions → „LEGO-Teiledaten aktualisieren“ → Run workflow.
name: LEGO-Teiledaten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # monatlich am 1. um 03:17 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSV-Dateien laden
        run: bash lego/tools/update-data.sh
      - name: Committen, falls sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add lego/data
          # version.json ändert sich immer – nur committen, wenn sich echte Daten geändert haben
          if git diff --cached --quiet -- lego/data/*.csv.gz && git ls-files --error-unmatch lego/data/parts.csv.gz >/dev/null 2>&1; then
            echo "Keine Datenänderung."
            exit 0
          fi
          git commit -m "LEGO-Teiledaten aktualisieren"
          git push
